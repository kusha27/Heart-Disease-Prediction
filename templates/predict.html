{% extends 'base.html' %}
{% block title %}HeartCare | Predict{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-10">
      <div class="card shadow border-0">
        <div class="card-body p-4 p-lg-5">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
              <p class="eyebrow mb-1">Assessment</p>
              <h2 class="text-navy mb-0">Heart Disease Prediction Form</h2>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">Dashboard</a>
          </div>

          <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="age">Age</label>
                <input type="number" class="form-control" id="age" name="age" min="18" max="100" value="{{ form_data.get('age','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="sex">Sex</label>
                <select class="form-select" id="sex" name="sex" required>
                  <option value="">Select</option>
                  <option value="1" {% if form_data.get('sex') == '1' %}selected{% endif %}>Male</option>
                  <option value="0" {% if form_data.get('sex') == '0' %}selected{% endif %}>Female</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="cp">Chest pain type</label>
                <select class="form-select" id="cp" name="cp" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('cp') == '0' %}selected{% endif %}>Typical angina</option>
                  <option value="1" {% if form_data.get('cp') == '1' %}selected{% endif %}>Atypical angina</option>
                  <option value="2" {% if form_data.get('cp') == '2' %}selected{% endif %}>Non-anginal pain</option>
                  <option value="3" {% if form_data.get('cp') == '3' %}selected{% endif %}>Asymptomatic</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="trestbps">Resting blood pressure (mmHg)</label>
                <input type="number" class="form-control" id="trestbps" name="trestbps" min="80" max="220" value="{{ form_data.get('trestbps','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="chol">Serum cholesterol (mg/dL)</label>
                <input type="number" class="form-control" id="chol" name="chol" min="100" max="600" value="{{ form_data.get('chol','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="fbs">Fasting blood sugar > 120 mg/dL</label>
                <select class="form-select" id="fbs" name="fbs" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('fbs') == '0' %}selected{% endif %}>False</option>
                  <option value="1" {% if form_data.get('fbs') == '1' %}selected{% endif %}>True</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="restecg">Resting ECG</label>
                <select class="form-select" id="restecg" name="restecg" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('restecg') == '0' %}selected{% endif %}>Normal</option>
                  <option value="1" {% if form_data.get('restecg') == '1' %}selected{% endif %}>ST-T wave abnormality</option>
                  <option value="2" {% if form_data.get('restecg') == '2' %}selected{% endif %}>Left ventricular hypertrophy</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="thalach">Max heart rate</label>
                <input type="number" class="form-control" id="thalach" name="thalach" min="60" max="220" value="{{ form_data.get('thalach','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="exang">Exercise-induced angina</label>
                <select class="form-select" id="exang" name="exang" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('exang') == '0' %}selected{% endif %}>No</option>
                  <option value="1" {% if form_data.get('exang') == '1' %}selected{% endif %}>Yes</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="oldpeak">ST depression</label>
                <input type="number" step="0.1" class="form-control" id="oldpeak" name="oldpeak" min="0" max="10" value="{{ form_data.get('oldpeak','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="slope">Peak exercise ST slope</label>
                <select class="form-select" id="slope" name="slope" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('slope') == '0' %}selected{% endif %}>Upsloping</option>
                  <option value="1" {% if form_data.get('slope') == '1' %}selected{% endif %}>Flat</option>
                  <option value="2" {% if form_data.get('slope') == '2' %}selected{% endif %}>Downsloping</option>
                </select>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="ca">Major vessels</label>
                <input type="number" class="form-control" id="ca" name="ca" min="0" max="4" value="{{ form_data.get('ca','') }}" required>
              </div>
              <div class="col-md-6 col-lg-4">
                <label class="form-label" for="thal">Thalassemia</label>
                <select class="form-select" id="thal" name="thal" required>
                  <option value="">Select</option>
                  <option value="0" {% if form_data.get('thal') == '0' %}selected{% endif %}>Normal</option>
                  <option value="1" {% if form_data.get('thal') == '1' %}selected{% endif %}>Fixed defect</option>
                  <option value="2" {% if form_data.get('thal') == '2' %}selected{% endif %}>Reversible defect</option>
                  <option value="3" {% if form_data.get('thal') == '3' %}selected{% endif %}>Unknown</option>
                </select>
              </div>
            </div>

            <div class="d-flex gap-3 mt-4 flex-wrap">
              <button type="submit" class="btn btn-primary">Predict</button>
              <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
